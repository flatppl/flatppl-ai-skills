name: Spec drift

# Weekly check that references/spec-reference.md still matches the live FlatPPL spec.
# A failed run signals the construct index needs reconciling; it does not gate PRs.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Compare spec-reference against the live spec
        run: pixi run check-drift
